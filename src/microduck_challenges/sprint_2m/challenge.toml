# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # next forward-drive fine-tune; does not alter the live run
num_envs       = 2048
max_iterations = 1200
seed           = 2

[params.forward_reward]
label = "Follow the speed order"
value = 4.92717633928571
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 2.0
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Lift your feet"
value = 6.0
min   = 0.0
max   = 6.0

# The NEXT Workshop/CLI launch is a genuine 81D-baseline warm start.
# Refresh the Workshop recipe and use 1200 NEW iterations (not a stale 600/3000).
# Both fine-tune stages refuse a cold start and choose by saved 5/5 race time.
[training]
stage = "drive"

[training.drive]
# Re-select the best compatible 5/5 result when the next process starts.
# Keep this run's 81D critic; do not substitute the older 77D source profile.
source_run = "2026-10-23_21-14-10_run-1023-2113"
max_iterations = 1200
save_interval = 25
learning_rate = 0.0001
hold_iterations = 50
ramp_iterations = 200
forward_reward = 12.0    # stronger signed course-speed reward: 0 -> 12; next run only
vel_ref = 1.5            # reward scale, not a speed command/cap
forward_variance = 0.30  # forward-pitch sin^2 tolerance: 0.05 -> 0.30
motion_speed = 0.5       # full lean relaxation above this forward speed (m/s)

[training.speed]
# Provenance: 6ac3c45; fastest saved 5/5 is model_750.pt, 2.588 s at 0.90 m/s.
# Preserve that run's 77D critic and productive-airtime/progress guidance.
source_run = "2026-10-23_01-11-14_run-1023-0109"
max_iterations = 600     # NEW updates, not the baseline's iteration number
save_interval = 25
learning_rate = 0.0001   # fixed; do not restore the baseline optimizer/LR
hold_iterations = 50     # retain learned regularization before the gradual ramp
ramp_iterations = 350
forward_reward = 5.0     # command-independent body-forward tanh reward, 0 -> 5
vel_ref = 1.5            # reward scale in m/s, not an achieved/commanded speed
