# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # bounded exploration screen; no training launched here
num_envs       = 2048
max_iterations = 500
seed           = 2

[params.forward_reward]
label = "Follow the speed order"
value = 4.92717633928571
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 2.0
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Lift your feet"
value = 6.0
min   = 0.0
max   = 6.0

# The normal Workshop/CLI launch explores from the retained 81D winner.
# Refresh an already-open Workshop form: the next screen is 500 NEW updates.
# Exploitation is a separate, explicitly gated launch; never an iteration timer.
[training]
stage = "refine"
phase = "explore"
reward_profile = "C4"      # C3 weights; full forward-lean tolerance at every speed

[training.phases.explore]
max_iterations = 500
save_interval = 50
learning_rate = 0.00005
entropy_coef = 0.01
clip_param = 0.2
exploration_std_scale = 1.0

[training.phases.exploit]
max_iterations = 500
save_interval = 50
learning_rate = 0.00001
entropy_coef = 0.001
clip_param = 0.1
exploration_std_scale = 0.5  # applied to restored noise only on a phase transition

[training.gate]
command_vx = 0.30          # frozen before evaluating candidates
neighbor_checkpoints = 3
heldout_first_seed = 6
heldout_seed_count = 20
goal_seconds = 0.8
max_wall_minutes = 40     # cap each explicitly requested local run

[training.refine]
# Preserve the source policy and environment age; free the legs for the next run.
free_legs = true           # no leg pose reward or leg action-rate cost; head smoothing stays
source_run = "2026-10-24_01-21-50_run-1024-0121"
# Explicit winner; never silently substitute the final model_9999.
source_checkpoint = 8250
# Budgets and PPO controls come only from training.phases.<phase> above.
# Source drive construction scalars for strict semantic validation, not a new ramp.
source_baseline_checkpoint = 2250
hold_iterations = 50
ramp_iterations = 200
forward_reward = 12.0
vel_ref = 1.5
forward_variance = 0.30
motion_speed = 0.5
lean_forward_variance = 0.80 # refinement override after source semantics are checked
lean_max_tilt_deg = 70.0    # brief only: >60 degrees for 0.3 s still ends the episode

[training.drive]
# Re-select the best compatible 5/5 result when the next process starts.
# Keep this run's 81D critic; do not substitute the older 77D source profile.
source_run = "2026-10-23_21-14-10_run-1023-2113"
max_iterations = 1200
save_interval = 25
learning_rate = 0.0001
hold_iterations = 50
ramp_iterations = 200
forward_reward = 12.0    # stronger signed course-speed reward: 0 -> 12; next run only
vel_ref = 1.5            # reward scale, not a speed command/cap
forward_variance = 0.30  # forward-pitch sin^2 tolerance: 0.05 -> 0.30
motion_speed = 0.5       # full lean relaxation above this forward speed (m/s)

[training.speed]
# Provenance: 6ac3c45; fastest saved 5/5 is model_750.pt, 2.588 s at 0.90 m/s.
# Preserve that run's 77D critic and productive-airtime/progress guidance.
source_run = "2026-10-23_01-11-14_run-1023-0109"
max_iterations = 600     # NEW updates, not the baseline's iteration number
save_interval = 25
learning_rate = 0.0001   # fixed; do not restore the baseline optimizer/LR
hold_iterations = 50     # retain learned regularization before the gradual ramp
ramp_iterations = 350
forward_reward = 5.0     # command-independent body-forward tanh reward, 0 -> 5
vel_ref = 1.5            # reward scale in m/s, not an achieved/commanded speed
