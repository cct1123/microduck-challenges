# The 2 m Sprint: walk a flat 2 m lane as fast as possible. The Arena races the
# policy at forward commands from 0.20 to 1.20 m/s and keeps its best.
event = "sprint-2m"
task  = "Mjlab-Sprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # aggressive sprint candidate; local RTX 3060 recipe
num_envs       = 2048
max_iterations = 3000
seed           = 2

[params.forward_reward]
label = "Sprint forward (2.5x command target)"
value = 5.0
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 1.5
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Fast productive steps"
value = 6.0
min   = 0.0
max   = 6.0
