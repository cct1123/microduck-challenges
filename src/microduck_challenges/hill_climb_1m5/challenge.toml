# The 1.5 m Hill Climb: walk up an 8° lane as fast as possible. The Arena races
# the policy at forward commands from 0.15 to 1.00 m/s and keeps its best.
event = "hill-climb-1m5"
task  = "Mjlab-HillClimb1m5-MicroDuck"
kind  = "perpetual"

[recipe]                  # the first training, as is
num_envs       = 2048
max_iterations = 3000
seed           = 1

# Bootstrap keeps the original beginner curriculum and optimization recipe.
# Refinement is a separate explicit launch, never an automatic phase switch.
[training]
stage = "bootstrap"
reward_profile = "A0"
bootstrap_wall_minutes = 180

[training.phases.explore]
max_iterations = 500
num_envs = 2048
save_interval = 50
learning_rate = 0.00005
entropy_coef = 0.01
clip_param = 0.2
exploration_std_scale = 1.0
max_wall_minutes = 40

[training.phases.exploit]
max_iterations = 500
num_envs = 2048
save_interval = 50
learning_rate = 0.00001
entropy_coef = 0.001
clip_param = 0.1
exploration_std_scale = 0.5
max_wall_minutes = 40

[training.gate]
neighbor_checkpoints = 3
heldout_first_seed = 6
heldout_seed_count = 20

[params.forward_reward]
label = "Follow the speed order"
value = 3.95619419642857
min   = 0.5
max   = 5.0

[params.upright_reward]
label = "Stay upright"
value = 2.0
min   = 0.5
max   = 5.0

[params.step_reward]
label = "Lift your feet"
value = 6.0
min   = 0.0
max   = 6.0

[params.max_slope_deg]
label = "Steepest training slope (°)"
value = 10.0
min   = 8.0
max   = 15.0
